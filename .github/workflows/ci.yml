name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # The suite mixes unittest classes and plain pytest functions; `unittest discover`
    # silently skips the latter, so pytest is required to collect everything.
    # Excluded here:
    #   - verify_web_app_live.py        requires a locally running server on port 8050
    #   - test_proxy_latency_discovery  hits the live Polymarket API (non-deterministic in CI)
    - name: Run Unit Tests
      run: |
        python -m pytest tests/ -v \
          --ignore=tests/verify_web_app_live.py \
          --deselect tests/test_proxy_server_latency.py::test_proxy_latency_discovery

    # The documented gate values and point weights are generated from the code's
    # SCORING_SPEC. This step fails when a doc drifts from the code, so the four
    # contradictions that previously lived in the docs cannot silently return.
    # Runs on both pushes to main and pull requests, which this workflow triggers on.
    - name: Verify Scoring Docs Match the Code
      run: |
        python tools/scoring_docs.py check

    - name: Verify Web App Entry Point
      run: |
        python screen.py --test
